[project]
name = "major-project"
version = "0.1.0"
description = "OBSLAM LiDAR payload bench server: S2 driver bridge, step-and-scan, 2.5D grid, dashboard API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "pyserial>=3.5",
    "pydantic>=2.7",
    "httpx>=0.28.1",
]

[project.scripts]
obslam-server = "obslam.server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obslam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
